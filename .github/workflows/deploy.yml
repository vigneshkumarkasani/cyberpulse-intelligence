# Deploys the Astro site to GitHub Pages. Runs on a push to `main` only.
#
# This file never runs for a pull request: pull requests run .github/workflows/ci.yml, which has no
# deployment permissions. Manual runs are not offered here. To publish again, re-run the last `main` run.
#
# One-time repository setting (required once):
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#
# Every third-party action is pinned to a full commit SHA, with its release tag in a comment.
# No secrets or API keys are used by this workflow.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

# Read the repository only. Each job requests more only where it needs it.
permissions:
  contents: read

# Deployments share one group. A deployment that is running is never cancelled. A deployment that is
# still waiting to start can be superseded by a newer push, so the newest commit on `main` is published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-artifact:
    # Builds the site and uploads it as a Pages artifact. Contents: read only.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests before publishing
        run: npm test

      - name: Type-check and build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  configure:
    # Checks that GitHub Pages is configured for this repository. The only job with pages: read.
    # configure-pages never writes (enablement is off), and its outputs are not used.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

  deploy:
    # Publishes the artifact. Runs only after the build and the Pages check have both succeeded.
    # The only job with pages: write and id-token: write.
    needs: [build-artifact, configure]
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
